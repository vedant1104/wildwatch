spring.application.name=wildwatch

spring.profiles.active=dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wildwatch}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wildwatch}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpassword}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Anthropic API key for Spring AI (used by com.example.wildwatch.service.AIService)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001

# Shared WebClient timeouts (used by com.example.wildwatch.config.WebClientConfig)
wildwatch.webclient.connect-timeout-ms=5000
wildwatch.webclient.read-timeout-ms=10000

# External API base URLs
wildwatch.gbif.base-url=https://api.gbif.org/v1
wildwatch.inaturalist.base-url=https://api.inaturalist.org/v1

# Resilience4j - GBIF client
resilience4j.retry.instances.gbif.max-attempts=3
resilience4j.retry.instances.gbif.wait-duration=500ms
resilience4j.retry.instances.gbif.enable-exponential-backoff=true
resilience4j.retry.instances.gbif.exponential-backoff-multiplier=2
resilience4j.retry.instances.gbif.retry-exceptions=org.springframework.web.reactive.function.client.WebClientResponseException,org.springframework.web.reactive.function.client.WebClientRequestException,java.util.concurrent.TimeoutException

resilience4j.circuitbreaker.instances.gbif.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gbif.sliding-window-size=10
resilience4j.circuitbreaker.instances.gbif.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gbif.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gbif.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.gbif.permitted-number-of-calls-in-half-open-state=3

# Resilience4j - iNaturalist client
resilience4j.retry.instances.inaturalist.max-attempts=3
resilience4j.retry.instances.inaturalist.wait-duration=500ms
resilience4j.retry.instances.inaturalist.enable-exponential-backoff=true
resilience4j.retry.instances.inaturalist.exponential-backoff-multiplier=2
resilience4j.retry.instances.inaturalist.retry-exceptions=org.springframework.web.reactive.function.client.WebClientResponseException,org.springframework.web.reactive.function.client.WebClientRequestException,java.util.concurrent.TimeoutException

resilience4j.circuitbreaker.instances.inaturalist.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inaturalist.sliding-window-size=10
resilience4j.circuitbreaker.instances.inaturalist.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inaturalist.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inaturalist.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inaturalist.permitted-number-of-calls-in-half-open-state=3

# Multipart upload limits for photo identification
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
